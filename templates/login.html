<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login - MHWilds TA
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="/"
            class="logo"
        >
            MHWilds TA
        </a>

    </div>

</header>


<main>


    <section class="login-box">

        <h1>
            Admin Login
        </h1>


        <p>
            管理者専用ページ
        </p>


        {% if error %}

        <div class="login-error">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
        >


            <div class="login-item">

                <label>
                    USERNAME
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>


            <div class="login-item">

                <label>
                    PASSWORD
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="search-button"
            >

                LOGIN

            </button>


        </form>


        <a
            href="/"
            class="back-link"
        >

            ← HOMEへ戻る

        </a>


    </section>


</main>


</body>

</html>
