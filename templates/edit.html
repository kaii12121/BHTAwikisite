<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Edit Record - MHWilds TA
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="/"
            class="logo"
        >
            MHWilds TA
        </a>

        <nav>

            <a href="/">
                Ranking
            </a>

            <a href="/quests">
                Quests
            </a>

            <a href="/rules">
                Rules
            </a>

            <a
                href="/admin"
                class="active"
            >
                Admin
            </a>

        </nav>

    </div>

</header>


<main>


    <section class="admin-page">


        <div class="admin-title">

            <p>
                ADMINISTRATION
            </p>

            <h1>
                EDIT RECORD
            </h1>

        </div>


        <form
            method="POST"
            class="admin-form"
        >


            <label>
                PLAYER
            </label>

            <input
                type="text"
                name="player"
                value="{{ record['player'] }}"
                required
            >



            <label>
                QUEST
            </label>

            <select
                name="quest"
                required
            >

                {% for quest in quests %}

                <option
                    value="{{ quest['name'] }}"
                    {% if record['quest'] == quest['name'] %}
                    selected
                    {% endif %}
                >

                    {{ quest['name'] }}

                </option>

                {% endfor %}

            </select>



            <label>
                WEAPON
            </label>

            <select
                name="weapon"
                required
            >

                {% for weapon in weapons %}

                <option
                    value="{{ weapon['name'] }}"
                    {% if record['weapon'] == weapon['name'] %}
                    selected
                    {% endif %}
                >

                    {{ weapon['name'] }}

                </option>

                {% endfor %}

            </select>



            <label>
                TIME
            </label>

            <input
                type="text"
                name="time"
                value="{{ '%02d:%05.2f'|format(record['time'] // 60, record['time'] % 60) }}"
                placeholder="02:31.42"
                required
            >



            <label>
                PLATFORM
            </label>

            <select
                name="platform"
                required
            >

                {% for platform in platforms %}

                <option
                    value="{{ platform['name'] }}"
                    {% if record['platform'] == platform['name'] %}
                    selected
                    {% endif %}
                >

                    {{ platform['name'] }}

                </option>

                {% endfor %}

            </select>



            <label>
                VIDEO URL
            </label>

            <input
                type="url"
                name="video_url"
                value="{{ record['video_url'] or '' }}"
            >



            <div class="admin-buttons">


                <button
                    type="submit"
                    class="admin-save-button"
                >
                    SAVE
                </button>


                <a
                    href="/admin"
                    class="admin-cancel-button"
                >
                    CANCEL
                </a>


            </div>


        </form>


    </section>


</main>


</body>

</html>
